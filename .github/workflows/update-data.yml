name: Uppdatera börsdata

# Hämtar bolagslistan (Nasdaq) och årsdata (Yahoo Finance) och sparar dem i repot.
# Vercel bygger om sidan automatiskt när datan ändras.
on:
  schedule:
    - cron: "17 5 * * 1-5" # vardagar 05:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/update-data.yml
      - scripts/fetch-fundamentals.mts

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Hämta bolagslista från Nasdaq
        run: npm run listings

      - name: Hämta årsdata från Yahoo Finance
        run: npm run fundamentals

      - name: Spara ändringar
        run: |
          git config user.name "valeur-data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/listings.json src/data/fundamentals.json
          if git diff --cached --quiet; then
            echo "Ingen ny data."
          else
            git commit -m "Uppdatera börsdata $(date -u +%Y-%m-%d)"
            git push
          fi
